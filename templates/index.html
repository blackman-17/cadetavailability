<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NCC Cadet Finder</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 450px;

            padding: 30px;
            border-radius: 15px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;

            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 12px;

            font-size: 16px;

            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;

            margin-top: 25px;

            font-size: 16px;
            font-weight: bold;

            color: white;
            background: #222;

            border: none;
            border-radius: 8px;

            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .results {
            margin-top: 30px;
        }

        .results h2 {
            margin-bottom: 15px;
        }

        .cadet {
            background: #f1f1f1;

            padding: 12px;
            margin-bottom: 8px;

            border-radius: 8px;
        }

        .no-results {
            margin-top: 25px;

            text-align: center;

            color: #777;
        }
    </style>

</head>


<body>

    <div class="container">

        <h1>🪖 NCC Cadet Finder</h1>


        <form method="POST">

            <label for="day">Select Day</label>

            <select name="day" id="day">

                <option value="mon">Monday</option>
                <option value="tue">Tuesday</option>
                <option value="wed">Wednesday</option>
                <option value="thu">Thursday</option>
                <option value="fri">Friday</option>
                <option value="sat">Saturday</option>

            </select>


            <label for="half">Select Half</label>

            <select name="half" id="half">

                <option value="1">First Half</option>
                <option value="2">Second Half</option>

            </select>


            <button type="submit">
                Find Available Cadets
            </button>

        </form>


        {% if freecadets %}

            <div class="results">

                <h2>Available Cadets</h2>

                {% for cadet in freecadets %}

                    <div class="cadet">
                        {{ cadet }}
                    </div>

                {% endfor %}

            </div>

        {% elif request.method == "POST" %}

            <div class="no-results">
                No cadets are available for this time.
            </div>

        {% endif %}


    </div>

</body>

</html>
